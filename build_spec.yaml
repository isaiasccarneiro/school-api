version: 0.1
component: build
timeoutInSeconds: 6000
runAs: root
shell: bash      
steps:
  - type: Command
    timeoutInSeconds: 1200
    name: "Build container image"
    command: |
      cd ${OCI_WORKSPACE_DIR}/python_app
      docker build -t school-api:v1.0 .
outputArtifacts:
  - name: school-api
    type: DOCKER_IMAGE
    location: school-api:v1.0

